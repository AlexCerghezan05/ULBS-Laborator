# D-023: nginx servește build-ul Vite și trimite /api spre backend.
# D-024: securitate de bază (fără versiune, headere de securitate, fără indexare).
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Headerele se moștenesc doar în location-urile fără add_header propriu.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # DNS-ul Docker; cu variabilă, nginx rezolvă din nou numele când backend-ul e recreat.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fișierele Vite (cu hash): un fișier lipsă dă 404, nu index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # index.html se verifică la fiecare încărcare, ca să nu ceară assets vechi.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
