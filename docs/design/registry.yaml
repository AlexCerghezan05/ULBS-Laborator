    source: none yet
    screenshots: []
    design_ref: none
    status: planned

  - id: DS-p21-storno-form
    kind: screen
    summary: Storno total sau parțial al unei facturi, legat de originală, pe seria facturii (D-005).
    roles: Admin, Operator
    source: none yet
    screenshots: []
    design_ref: none
    status: planned

  - id: DS-p21-payments
    kind: screen
    summary: Lista încasărilor și formularul de încasare (parțială, multiplă, numerar sau transfer); chitanța pentru numerar.
    roles: Admin, Operator (editează); Contabil (citire)
    source: none yet
    screenshots: []
    design_ref: none
