    source: none yet
    screenshots: []
    design_ref: none
    status: planned

  - id: DS-p21-invoice-form
    kind: screen
    summary: Crearea unei facturi sau proforme - serie, client, date (emitere, scadență), monedă (RON/EUR/USD, D-008), linii cu discount și cote TVA multiple, totaluri.
