spring.application.name=p21-backend
# Conexiunea la baza de date vine doar din mediu (docker-compose.yml, .env):
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# Hash-ul BCrypt al parolei utilizatorilor de test din seed (db/seed/R__seed.sql), din .env.
# Gol = conturile de test nu se pot loga. Parola nu intră niciodată în repo.
spring.flyway.placeholders.seed_password_hash=${P21_SEED_PASSWORD_HASH:}
# D-046: conturile din producție (db/prod/R__prod_start.sql), din variabilele secrete Render.
# Doar hash-ul BCrypt; Admin obligatoriu, Operator și Contabil opționale. Local rămân goale.
spring.flyway.placeholders.admin_username=${P21_ADMIN_USERNAME:}
spring.flyway.placeholders.admin_password_hash=${P21_ADMIN_PASSWORD_HASH:}
spring.flyway.placeholders.operator_username=${P21_OPERATOR_USERNAME:}
spring.flyway.placeholders.operator_password_hash=${P21_OPERATOR_PASSWORD_HASH:}
spring.flyway.placeholders.contabil_username=${P21_CONTABIL_USERNAME:}
spring.flyway.placeholders.contabil_password_hash=${P21_CONTABIL_PASSWORD_HASH:}
# D-044: în spatele nginx (și al proxy-ului Render) backend-ul citește X-Forwarded-Proto/Host:
# cererea e HTTPS (cookie-ul XSRF-TOKEN e Secure) și documentația arată adresa frontend-ului.
server.forward-headers-strategy=framework
# D-039: sesiunea pe server, 30 de minute de inactivitate; cookie HttpOnly, SameSite=Lax, doar prin cookie.
# Secure implicit; local (http://localhost) Compose pune P21_COOKIE_SECURE=false.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${P21_COOKIE_SECURE:true}
# D-043: documentația API sub /api/ (nginx trimite doar /api/ la backend), doar pentru Admin (SecurityConfig).
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/ui
# „Try it out”: Swagger UI trimite X-XSRF-TOKEN din cookie-ul XSRF-TOKEN, ca frontend-ul (D-039).
springdoc.swagger-ui.csrf.enabled=true
