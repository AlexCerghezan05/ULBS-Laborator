# La fiecare push: testele backend-ului (aceeași comandă ca local, D-023) și ledger-lint.
name: CI

on: push

# D-024: tokenul CI doar citește; acțiunile sunt fixate pe SHA.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurare .env din exemplu (fără secrete)
        run: cp .env.example .env
      - name: Teste (mvn -B verify pe db-test)
        run: docker compose --profile test run --rm backend-test
      - name: Oprire servicii de test
        if: always()
        run: docker compose --profile test down

  ledger-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ledger lint
        run: python3 docs/agents/tools/ledger-lint.py
